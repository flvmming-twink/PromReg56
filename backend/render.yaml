services:
  - type: web
    name: regional-economy-app
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: regional-economy-db
          property: connectionString
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_LOGIN
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: YANDEX_MAPS_API_KEY
        sync: false

databases:
  - name: regional-economy-db
    databaseName: regional_economy
    user: regional_economy
    plan: free
    region: frankfurt
